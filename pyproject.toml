[project]
name = "basenn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4",
    "ipywidgets>=8",
    "numpy",
    "matplotlib",
    "torch",
    "torchvision",
]

# Pulling pinned pytorch 12.6 for NVIDIA Pascal gpu support
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
